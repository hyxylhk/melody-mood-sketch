# =============================================================================
# pytest.ini —— pytest 配置
# =============================================================================
# pythonpath = .
#     把项目根目录加入模块搜索路径，这样测试文件里才能写
#         from backend.main import app
#     否则会报 ModuleNotFoundError: No module named 'backend'
#
# testpaths = tests
#     直接执行 pytest 时默认只搜 tests 目录
#
# 运行方式（项目根目录）：
#     pytest                      跑全部
#     pytest -v                   显示每条用例名
#     pytest tests/test_api.py    只跑某个文件
# =============================================================================

[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
# -ra 显示所有用例的简报；--strict-markers 防止打错标记名却静默通过
